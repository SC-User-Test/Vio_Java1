# Application Configuration for Cloud Deployment
# All sensitive values should be provided via environment variables

# Application Name
app.name=violations-demo
app.version=1.0.0

# AWS Configuration
# These should be overridden by environment variables in cloud deployment
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:app-data-bucket}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.violations=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Cloud-Native Settings
# Use environment variables for all configuration
cloud.platform=AWS
cloud.deployment.mode=${DEPLOYMENT_MODE:production}

# Working Directory (configurable via environment)
work.directory=${WORK_DIR:.}
